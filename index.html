<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHADOW JARA - Normal Hustle 💧🍶</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700;900&display=swap');
body{margin:0;background:#fef08a;font-family:'Fredoka';overflow:hidden;touch-action:none}
h1{margin:6px 0 0;text-align:center;font-size:28px;line-height:0.9} h1 span{background:#000;color:#fef08a;padding:2px 10px;border-radius:10px}
#hud{display:flex;justify-content:center;gap:5px;margin:6px}
.pill{background:#fff;border:3px solid #000;border-radius:99px;padding:6px 11px;font-weight:900;box-shadow:3px 3px 0 #000;font-size:11px}
#game{position:relative;width:100%;max-width:400px;height:74vh;max-height:680px;margin:0 auto;background:linear-gradient(#60a5fa 0%,#fef08a 70%);border:4px solid #000;border-radius:22px;box-shadow:8px 8px 0 #000;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;background:#fef08af2;backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.btn{padding:13px 22px;border-radius:99px;border:3px solid #000;font-weight:900;box-shadow:4px 4px 0 #000;cursor:pointer}
.btn-y{background:#facc15}
#soundBtn{position:absolute;top:6px;right:6px;background:#fff;border:2px solid #000;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:900;box-shadow:2px 2px 0 #000;z-index:5}
</style>
</head>
<body>
<h1>Pure Water + Eva<br><span>SHADOW JARA 💧🍶</span></h1>
<div id="hud"><div class="pill">💰 ₦<span id="naira">0</span></div><div class="pill">💧 <span id="count">10</span>/10</div><div class="pill">BEST ₦<span id="best">0</span></div></div>
<div id="game">
<button id="soundBtn" onclick="toggleSound()">🔊 Sound</button>
<canvas id="c" width="400" height="680"></canvas>
<div id="overlay">
<div style="font-size:50px">💧🍶😊</div>
<h2 style="margin:6px 0">Normal Lagos Hustle</h2>
<p style="font-size:12px;color:#333;margin:0 0 8px">Slow & sweet — like real market.<br>Drag SLOWLY, balance jejely. No rush!</p>
<button class="btn btn-y" onclick="start()">▶️ ENTER MARKET</button>
<p style="font-size:10px;color:#666;margin-top:6px">👉 Drag finger gently left/right</p>
</div>
</div>
</div>

<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let audio, soundOn=true, tilt=0, targetTilt=0, trayX=200, trayAngle=0, items=[], naira=0, best=parseInt(localStorage.getItem('jara_best')||0), running=false, time=0, people=[], cars=[];
document.getElementById('best').innerText=best;

function initAudio(){ try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(f,d,t='sine',v=0.25){ if(!audio||!soundOn) return; let o=audio.createOscillator(), g=audio.createGain(); o.type=t; o.frequency.value=f; g.gain.value=v; o.connect(g); g.connect(audio.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime+d); o.stop(audio.currentTime+d); }
function sCoin(){ tone(880,0.12,'sine',0.3); setTimeout(()=>tone(1200,0.12,'sine',0.3),70); }
function sCoinBig(){ tone(600,0.15,'sine',0.4); setTimeout(()=>tone(900,0.15,'sine',0.4),70); setTimeout(()=>tone(1300,0.18,'sine',0.4),150); }
function sHorn(){ tone(180,0.2,'sawtooth',0.35); setTimeout(()=>tone(240,0.2,'sawtooth',0.35),100); }
function sFall(){ tone(120,0.35,'triangle',0.3); }
function toggleSound(){ soundOn=!soundOn; document.getElementById('soundBtn').innerText=soundOn?'🔊 Sound':'🔇 Mute'; if(soundOn&&!audio) initAudio(); }

function start(){
if(!audio) initAudio(); if(audio&&audio.state==='suspended') audio.resume();
document.getElementById('overlay').style.display='none';
items=[];
for(let i=0;i<8;i++) items.push({type:'sachet', offX:(i-3.5)*15, x:200, y:0, onTray:true, vy:0, vx:0, price:50});
for(let i=0;i<2;i++) items.push({type:'bottle', offX:(i-0.5)*18+38, x:200, y:0, onTray:true, vy:0, vx:0, price:200});
people=[]; for(let i=0;i<5;i++) people.push({x:Math.random()*400, y:570+Math.random()*40, speed:0.15+Math.random()*0.25, type:Math.floor(Math.random()*5)});
cars=[]; for(let i=0;i<2;i++) cars.push({x:-100-i*350, speed:0.6+Math.random()*0.4});
naira=0; trayX=200; tilt=0; targetTilt=0; time=0; running=true; loop();
}

function drawSachet(x,y){
ctx.fillStyle='#a5f3fc'; ctx.strokeStyle='#000'; ctx.lineWidth=2;
ctx.beginPath(); ctx.moveTo(x-10,y-8); ctx.lineTo(x+10,y-8); ctx.lineTo(x+12,y+6); ctx.lineTo(x-12,y+6); ctx.closePath(); ctx.fill(); ctx.stroke();
ctx.fillStyle='#fff'; ctx.fillRect(x-6,y-4,8,3);
ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(x,y-10,1.8,0,6.28); ctx.fill();
ctx.fillStyle='#0891b2'; ctx.font='bold 6px Fredoka'; ctx.fillText('PURE',x-7,y+2);
}
function drawBottle(x,y){
ctx.fillStyle='#e0f2fe'; ctx.strokeStyle='#000'; ctx.lineWidth=2;
ctx.fillRect(x-6,y-18,12,18); ctx.strokeRect(x-6,y-18,12,18);
ctx.fillStyle='#0284c7'; ctx.fillRect(x-6,y-22,12,5); ctx.strokeRect(x-6,y-22,12,5);
ctx.fillStyle='#fff'; ctx.font='bold 5px Fredoka'; ctx.fillText('EVA',x-5,y-8);
}

function loop(){
if(!running) return; time+=0.016;
// SLOW & NORMAL physics
tilt+=(targetTilt-tilt)*0.04;
trayX+=(200+tilt*2.2-trayX)*0.03;
trayX=Math.max(90,Math.min(310,trayX));
trayAngle=tilt*0.018; // very small tilt = calm

let grad=ctx.createLinearGradient(0,0,0,540); grad.addColorStop(0,'#60a5fa'); grad.addColorStop(1,'#fef08a'); ctx.fillStyle=grad; ctx.fillRect(0,0,400,560);
ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(340,70,26,0,6.28); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.stroke();

cars.forEach(c=>{
c.x+=c.speed; if(c.x>460){ c.x=-120; c.speed=0.5+Math.random()*0.4; if(Math.random()<0.15) sHorn(); }
ctx.fillStyle='#facc15'; ctx.fillRect(c.x,505,90,26); ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeRect(c.x,505,90,26);
ctx.fillStyle='#000'; ctx.font='bold 9px Fredoka'; ctx.fillText('DANFO',c.x+24,521);
ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(c.x+14,531,7,0,6.28); ctx.arc(c.x+76,531,7,0,6.28); ctx.fill();
});

ctx.fillStyle='#334155'; ctx.fillRect(0,548,400,132);
ctx.fillStyle='#cbd5e1'; ctx.fillRect(0,548,400,5);

people.forEach(p=>{
p.x+=p.speed; if(p.x>430) p.x=-30;
ctx.font='20px serif'; let em=['🧑🏿','👩🏾','👨🏾‍💼','🧕🏾','👷🏾'][p.type]; ctx.fillText(em,p.x,p.y);
});

ctx.fillStyle='#7c2d12'; ctx.beginPath(); ctx.arc(trayX,490,20,0,6.28); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.stroke();
ctx.save(); ctx.translate(trayX,468); ctx.rotate(trayAngle);
ctx.fillStyle='#a16207'; ctx.fillRect(-75,-10,150,14); ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeRect(-75,-10,150,14);
ctx.restore();

let alive=0;
items.forEach(it=>{
if(it.onTray){
it.x=trayX+it.offX; it.y=468-12; alive++;
// VERY HARD to fall now - normal life
if(Math.abs(trayAngle)>1.2 && Math.random()<0.008){ it.onTray=false; it.vx=trayAngle*3; sFall(); }
} else {
it.vy+=0.3; it.y+=it.vy; it.x+=it.vx;
if(it.type==='sachet') drawSachet(it.x,it.y); else drawBottle(it.x,it.y);
}
if(it.onTray){
if(it.type==='sachet') drawSachet(it.x,it.y); else drawBottle(it.x,it.y);
}
});

// slower sales - normal market
if(Math.random()<0.025 && alive>0){
let buying=items.filter(i=>i.onTray)[Math.floor(Math.random()*alive)];
if(buying){
let price=buying.price; naira+=price; document.getElementById('naira').innerText=naira;
if(price>100) sCoinBig(); else sCoin();
let el=document.createElement('div'); el.innerText='+₦'+price; el.style.cssText='position:absolute;left:'+trayX+'px;top:300px;font-weight:900;color:#000;background:'+(price>100?'#38bdf8':'#facc15')+';border:2px solid #000;border-radius:10px;padding:2px 7px;animation:up 0.7s forwards;font-size:13px'; document.getElementById('game').appendChild(el); setTimeout(()=>el.remove(),700);
if(naira>best){best=naira; localStorage.setItem('jara_best',best); document.getElementById('best').innerText=best;}
}
}

document.getElementById('count').innerText=alive+'/10';
if(alive===0){ gameOver(); return; }
requestAnimationFrame(loop);
}

function gameOver(){
running=false; sFall();
let ov=document.getElementById('overlay'); ov.style.display='flex';
ov.innerHTML=`<div style="font-size:56px">${naira>800?'👑':'😊'}💧</div><h2>${naira>800?'MARKET QUEEN!':'Nice Hustle!'}</h2><p>You make ₦${naira} in ${Math.floor(time)}s<br>Drag slowly next time — jejely!</p><div class="pill">💰 Total: ₦${naira}</div><br><button class="btn btn-y" onclick="start()">🔄 Again</button><br><a href="https://wa.me/2349031498864?text=I%20make%20₦${naira}%20with%20Pure%20Water%20%26%20Eva%20💧🍶%20Play%20am%20👉%20${location.href}" style="margin-top:10px;background:#000;color:#fff;padding:10px 18px;border-radius:99px;text-decoration:none;font-weight:900;font-size:13px;display:inline-block">Share 💧</a>`;
}
let sx=0;
canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX; if(audio&&audio.state==='suspended') audio.resume();});
canvas.addEventListener('touchmove',e=>{e.preventDefault(); let dx=e.touches[0].clientX-sx; targetTilt=dx*0.25; sx=e.touches[0].clientX;},{passive:false});
canvas.addEventListener('touchend',()=>{targetTilt*=0.2});
canvas.addEventListener('mousedown',e=>{sx=e.clientX});
canvas.addEventListener('mousemove',e=>{ if(e.buttons===1){ let r=canvas.getBoundingClientRect(); targetTilt=((e.clientX-r.left)/r.width*400-200)*0.25; } });
</script>
<style>@keyframes up{to{transform:translateY(-60px);opacity:0}}</style>
</body>
</html>
