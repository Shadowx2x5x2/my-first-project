<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Water vs Eva - BOLD EDITION</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Fredoka:wght@700;900&display=swap');
body{margin:0;background:#0a0a0a;color:white;font-family:'Fredoka',sans-serif;overflow-x:hidden}
h1{font-family:'Black Han Sans',sans-serif;font-size:38px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:2px;text-shadow:4px 4px 0px #ff0066,8px 8px 0px #000;line-height:1.1;margin:15px 10px}
.game-box{background:linear-gradient(180deg,#1a1a1a,#000);border:4px solid #ff0066;border-radius:20px;margin:15px;padding:20px;box-shadow:0 0 30px rgba(255,0,102,0.6)}
.btn{width:100%;padding:18px;font-size:22px;font-weight:900;background:#ff0066;color:white;border:none;border-radius:12px;text-transform:uppercase;letter-spacing:1px;box-shadow:0 6px 0 #99003d}
.score{font-size:28px;font-weight:900;text-align:center;color:#00ff88;text-shadow:2px 2px 0 #000}
</style>
</head>
<body>
<h1>💧 PURE WATER VS EVA 💧<br>BOLD EDITION</h1>
<div class="game-box">
<div class="score">SCORE: <span id="score">0</span></div>
<br>
<button class="btn" onclick="tap()">TAP TO WIN! 🔥</button>
<br><br>
<div style="text-align:center;font-weight:900;font-size:18px;">SHADOWx2x5x2 - LAGOS EDITION 🇳🇬</div>
</div>
<script>
let s=0;
function tap(){s+=10;document.getElementById('score').innerText=s; if(navigator.vibrate) navigator.vibrate(50);}
</script>
</body>
</html>
